services:
  # Backend API Service
  - type: web
    name: fobsim-backend
    env: docker
    dockerContext: .
    dockerfilePath: api/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: https://fobsim-frontend.onrender.com
      - key: PORT
        value: 8000

  # Frontend Next.js Service
  - type: web
    name: fobsim-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Manually set this to the Backend's external URL in the dashboard
